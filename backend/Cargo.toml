[package]
name = "mirante-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "API e motor de análise de cobertura jornalística do Mirante."
authors = ["Mirante contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gustavomello9600/mirante"
homepage = "https://github.com/gustavomello9600/mirante"
keywords = ["news", "media", "journalism", "axum"]
categories = ["web-programming"]
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json", "cookies"] }
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
deunicode = "1"
rust-stemmers = "1.2"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
regex = "1"
futures = "0.3"
encoding_rs = "0.8"
scraper = "0.29"
once_cell = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
